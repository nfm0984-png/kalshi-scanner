name: Kalshi scanner
# :20 = full hourly scan. 5,35,50 = light followed-check of pinned books only.
# workflow_dispatch: leave mode blank (or "scan") for a full scan; "follow-check" for a light run.
# push to main deploys the already-built site and does not run a scan.
on:
  schedule:
    - cron: "20 * * * *"
    - cron: "5,35,50 * * * *"
  workflow_dispatch:
    inputs:
      new_names:
        description: "How many new names to inspect (full scans only; 0 = review the queue only)"
        required: false
        default: "30"
        type: string
      review_new:
        description: "Also inspect the newly queued names in this same full scan"
        required: false
        default: false
        type: boolean
      mode:
        description: "scan (full) or follow-check (pinned books only)"
        required: false
        default: "scan"
        type: choice
        options:
          - scan
          - follow-check
  push:
    branches: [main]
    paths-ignore:
      - "README.md"

# Keep a running scan; a new one waits. Never cancel mid-Kalshi-crawl.
concurrency:
  group: kalshi-scanner
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scan-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    env:
      KALSHI_SCANNER_PASSCODE: ${{ secrets.KALSHI_SCANNER_PASSCODE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan or followed-check
        if: github.event_name != 'push'
        env:
          NEW_NAMES: ${{ github.event.inputs.new_names || '30' }}
          NEW_PER_SCAN: ${{ github.event.inputs.new_names || '30' }}
          REVIEW_NEW: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.mode != 'follow-check' && github.event.inputs.review_new) && '1' || '' }}
          KALSHI_SCAN_MODE: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'follow-check') && 'follow' || (github.event_name == 'schedule' && github.event.schedule == '5,35,50 * * * *') && 'follow' || 'scan' }}
        run: |
          set -euo pipefail
          pip install -q cryptography
          python scanner/scan.py
          if [ "${KALSHI_SCAN_MODE}" = "follow" ]; then
            echo "follow-check finished"
          else
            python scanner/validate_json.py data.json
          fi

      - name: Read follow-check change flag
        if: github.event_name != 'push'
        id: changed
        run: |
          set -euo pipefail
          if [ -f scanner/.follow_changed ]; then
            VAL=$(tr -d '[:space:]' < scanner/.follow_changed)
            echo "value=${VAL:-1}" >> "$GITHUB_OUTPUT"
          else
            echo "value=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Encrypt published data
        if: github.event_name == 'push' || steps.changed.outputs.value == '1'
        run: |
          set -euo pipefail
          pip install -q cryptography
          python scanner/gate_crypto.py encrypt
          # Full scans already validated plaintext. Follow-check changes and push deploys
          # must not send a wrapping-less file. gate_crypto leaves already-wrapped files alone
          # (push) and wraps plaintext written by this run.

      - name: Commit scan results
        if: github.event_name != 'push' && steps.changed.outputs.value == '1'
        run: |
          set -euo pipefail
          git config user.name "kalshi-scanner"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json index.html app.js
          if [ -d data ]; then git add -A data; fi
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            MSG="scan"
            if [ "${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'follow-check') && 'follow' || (github.event_name == 'schedule' && github.event.schedule == '5,35,50 * * * *') && 'follow' || 'scan' }}" = "follow" ]; then
              MSG="followed check"
            fi
            git commit -m "$MSG"
            git push
          fi

      - name: Stage Pages
        if: github.event_name == 'push' || steps.changed.outputs.value == '1'
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html app.js data.json robots.txt gate.json _site/
          if [ -f config.js ]; then cp config.js _site/; fi
          echo "nfm0984-png.github.io" > _site/CNAME

      - name: Setup Pages
        if: github.event_name == 'push' || steps.changed.outputs.value == '1'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name == 'push' || steps.changed.outputs.value == '1'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # deploy-pages@v4 can miss the artifact if it starts immediately after the upload.
      - name: Wait for Pages artifact
        if: github.event_name == 'push' || steps.changed.outputs.value == '1'
        run: sleep 20

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' || steps.changed.outputs.value == '1'
        id: pages
        uses: actions/deploy-pages@v4
