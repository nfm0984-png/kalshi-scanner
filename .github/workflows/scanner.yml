name: Kalshi scanner
# :20 UTC = full hourly scan (minute :20 PT as well while the offset is whole hours).
# 5-minute followed-checks live in follow-check.yml (hourly :30 start, loop every 5 min).
# Scheduled runs no-op from midnight–6 AM America/Los_Angeles (DST-safe).
# workflow_dispatch: leave mode blank (or "scan") for a full scan; "follow-check" for a light run.
# Frontend pushes are deployed by deploy.yml, not here.
# Manual dispatch is always allowed, including overnight.
on:
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch:
    inputs:
      new_names:
        description: "How many new names to inspect (full scans only; 0 = review the queue only)"
        required: false
        default: "30"
        type: string
      review_new:
        description: "Also inspect the newly queued names in this same full scan"
        required: false
        default: false
        type: boolean
      mode:
        description: "scan (full) or follow-check (pinned books only)"
        required: false
        default: "scan"
        type: choice
        options:
          - scan
          - follow-check

# Full scans have their own group so a queued follow-check or a frontend push
# can never evict a waiting full scan (GitHub keeps only one pending run per
# group). The 5-minute follow-check loop runs in parallel in its own group.
# Publishing happens in deploy.yml (dispatched below).
concurrency:
  group: kalshi-full-scan
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  scan-and-deploy:
    runs-on: ubuntu-latest
    env:
      KALSHI_SCANNER_PASSCODE: ${{ secrets.KALSHI_SCANNER_PASSCODE }}
    steps:
      - name: Quiet hours (midnight–6 AM PT)
        id: quiet
        if: github.event_name == 'schedule'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo("America/Los_Angeles"))
          skip = 0 <= now.hour < 6
          print("PT now %s hour=%d quiet=%s" % (now.strftime("%a %b %-d %-I:%M %p %Z"), now.hour, skip))
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("skip=%s\n" % ("1" if skip else "0"))
          PY

      - uses: actions/checkout@v4
        if: github.event_name != 'schedule' || steps.quiet.outputs.skip != '1'

      - uses: actions/setup-python@v5
        if: github.event_name != 'schedule' || steps.quiet.outputs.skip != '1'
        with:
          python-version: "3.12"

      - name: Scan or followed-check
        if: github.event_name != 'push' && (github.event_name != 'schedule' || steps.quiet.outputs.skip != '1')
        env:
          NEW_NAMES: ${{ github.event.inputs.new_names || '30' }}
          NEW_PER_SCAN: ${{ github.event.inputs.new_names || '30' }}
          REVIEW_NEW: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.mode != 'follow-check' && github.event.inputs.review_new) && '1' || '' }}
          KALSHI_SCAN_MODE: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'follow-check') && 'follow' || (github.event_name == 'schedule' && github.event.schedule == '*/5 * * * *') && 'follow' || 'scan' }}
          ORCA_API_KEY: ${{ secrets.ORCA_API_KEY }}
        run: |
          set -euo pipefail
          if [ "${KALSHI_SCAN_MODE}" = "follow" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            MIN=$(python3 -c "from datetime import datetime, timezone; print(datetime.now(timezone.utc).minute)")
            if [ "$MIN" -ge 18 ] && [ "$MIN" -le 22 ]; then
              echo "Skipping the 5-minute check near :20 UTC so the hourly full scan can run."
              mkdir -p scanner
              echo 0 > scanner/.follow_changed
              exit 0
            fi
          fi
          pip install -q cryptography
          python scanner/scan.py
          if [ "${KALSHI_SCAN_MODE}" = "follow" ]; then
            echo "follow-check finished"
          else
            python scanner/validate_json.py data.json
          fi

      - name: Read follow-check change flag
        if: github.event_name != 'push' && (github.event_name != 'schedule' || steps.quiet.outputs.skip != '1')
        id: changed
        run: |
          set -euo pipefail
          if [ -f scanner/.follow_changed ]; then
            VAL=$(tr -d '[:space:]' < scanner/.follow_changed)
            echo "value=${VAL:-1}" >> "$GITHUB_OUTPUT"
          else
            echo "value=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Encrypt published data
        if: github.event_name == 'push' || steps.changed.outputs.value == '1'
        run: |
          set -euo pipefail
          pip install -q cryptography
          python scanner/gate_crypto.py encrypt
          # Full scans already validated plaintext. Follow-check changes and push deploys
          # must not send a wrapping-less file. gate_crypto leaves already-wrapped files alone
          # (push) and wraps plaintext written by this run.

      - name: Commit scan results
        if: github.event_name != 'push' && steps.changed.outputs.value == '1'
        run: |
          set -euo pipefail
          git config user.name "kalshi-scanner"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if [ -d data ]; then git add -A data; fi
          # Do not add app.js/index.html — a stale checkout would revert frontend commits.
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            MSG="scan"
            if [ "${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'follow-check') && 'follow' || (github.event_name == 'schedule' && github.event.schedule == '*/5 * * * *') && 'follow' || 'scan' }}" = "follow" ]; then
              MSG="followed check"
            fi
            git commit -m "$MSG"
            i=0
            while [ $i -lt 3 ]; do
              i=$((i + 1))
              git pull --rebase origin main && git push && break
              echo "push failed (attempt $i); retrying"
              # A follow-check pushed while this scan ran. The full scan is the
              # newer, complete picture: keep this run's data ("theirs" in a rebase).
              if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
                git checkout --theirs -- data.json data 2>/dev/null || true
                git add data.json
                if [ -d data ]; then git add -A data; fi
                if GIT_EDITOR=true git rebase --continue && git push; then break; fi
              fi
              git rebase --abort 2>/dev/null || true
              sleep 8
            done
            git status -sb
            git rev-parse HEAD
            git log -1 --oneline origin/main || true
          fi

      - name: Publish (dispatch deploy.yml)
        if: steps.changed.outputs.value == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main -R "${{ github.repository }}"
